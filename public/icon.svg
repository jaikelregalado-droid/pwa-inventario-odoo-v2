<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="24" y="24" width="464" height="464" rx="96" fill="none" stroke="url(#glow)" stroke-width="6" opacity="0.3"/>
  <g transform="translate(96, 96)" filter="url(#shadow)">
    <!-- Box / Inventory icon -->
    <path d="M160 20 L280 80 L160 140 L40 80 Z" fill="#6366f1" opacity="0.9"/>
    <path d="M40 85 L160 145 L160 280 L40 220 Z" fill="#4f46e5"/>
    <path d="M280 85 L160 145 L160 280 L280 220 Z" fill="#4338ca"/>
    <!-- Barcode scanner lines -->
    <rect x="90" y="105" width="8" height="60" rx="4" fill="#38bdf8" opacity="0.95"/>
    <rect x="108" y="105" width="4" height="60" rx="2" fill="#38bdf8" opacity="0.95"/>
    <rect x="122" y="105" width="12" height="60" rx="4" fill="#38bdf8" opacity="0.95"/>
    <rect x="144" y="105" width="6" height="60" rx="3" fill="#38bdf8" opacity="0.95"/>
    <rect x="160" y="105" width="10" height="60" rx="4" fill="#38bdf8" opacity="0.95"/>
    <rect x="180" y="105" width="4" height="60" rx="2" fill="#38bdf8" opacity="0.95"/>
    <rect x="194" y="105" width="8" height="60" rx="4" fill="#38bdf8" opacity="0.95"/>
    <rect x="212" y="105" width="14" height="60" rx="4" fill="#38bdf8" opacity="0.95"/>
    <!-- Laser beam scanning line -->
    <line x1="60" y1="135" x2="250" y2="135" stroke="#ef4444" stroke-width="4" stroke-linecap="round"/>
    <!-- Glowing checkmark on inventory badge -->
    <circle cx="240" cy="240" r="44" fill="#10b981"/>
    <path d="M224 240 L236 252 L258 228" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>